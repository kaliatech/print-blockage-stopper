# Builds the image and publishes it as ghcr.io/<owner>/<repo>.
#   push tag v1.2.3     -> :1.2.3, :latest
#   push tag v1.3.0-rc.1 -> :1.3.0-rc.1
# A manual run on a tag publishes the same tags again. A manual run on a
# branch builds the image but does not push.
name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so `git describe` finds the nearest tag.
          fetch-depth: 0

      # The nearest tag, the commits since it, and the short hash (e.g. v1.2.0-3-g975bd6a).
      # On a tag push this is just the tag. Shown in the dashboard footer.
      - id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
