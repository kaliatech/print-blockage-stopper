# Builds the image locally. Run `docker compose up -d --build`, then open http://localhost:8631.
# Port 631 (CUPS) stays unpublished. The dashboard and print jobs reach CUPS inside the container.
services:
  print-blockage-stopper:
    build: .
    ports:
      - "8631:8631"
    volumes:
      - ./data:/data
    # Docker's default capability set cut down to what CUPS needs (tested against a simulated IPP printer).
    #   CHOWN, DAC_OVERRIDE: cupsd prepares its spool and local auth cert. Without them, jobs or adding printers fail.
    #   SETUID, SETGID: cupsd runs print filters as the lp user. Without them, jobs never finish.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
